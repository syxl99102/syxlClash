name: Build Zashboard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'zashboard-apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 缓存调试签名：命中时每次构建签名一致，手机可直接覆盖安装
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: zashboard-apk
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Zashboard 面板 APK（自动构建）
          body: |
            面板壳的最新构建：直接下载 app-debug.apk 安装即可。
            应用内置 Zashboard 面板，并在每次启动时自动检查面板更新。
          files: zashboard-apk/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          overwrite_files: true
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: zashboard-apk
          path: zashboard-apk/app/build/outputs/apk/debug/*.apk
